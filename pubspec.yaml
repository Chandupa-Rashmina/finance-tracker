name: finance_tracker
description: A personal finance tracking app with local JSON database
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Your existing dependencies
  fl_chart: ^0.66.0
  path_provider: ^2.1.1
  intl: ^0.18.1
  csv: ^5.0.2
  # NEW DEPENDENCIES FOR FIREBASE & RIVERPOD
  firebase_core: ^2.15.1
  firebase_auth: ^4.9.0 # Change from ^4.9.1 to ^4.9.0  cloud_firestore: ^4.16.1
  flutter_riverpod: ^2.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
